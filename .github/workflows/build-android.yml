name: Build SwipeClean Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  release:
    types: [ published, edited ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          SDKM=$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | tail -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" 

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Android Project & Assets
        run: |
          python3 - << 'PY'
          import base64, gzip, os, shutil

          os.makedirs("app/src/main/java/com/swipeclean/gallery", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)
          os.makedirs("app/src/main/res/mipmap-xxxhdpi", exist_ok=True)

          files = {
              "settings.gradle": "",
              "build.gradle": "cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMi4yJyBhcHBseSBmYWxzZQp9Cg==",
              "app/build.gradle": "",
              "app/swipeclean.jks": "",
              "app/src/main/AndroidManifest.xml": "",
              "app/src/main/java/com/swipeclean/gallery/MainActivity.java": "",
              "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png": "",
              "app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png": ""
          }

          for path, content_b64 in files.items():
              with open(path, "wb") as f:
                  f.write(base64.b64decode(content_b64))

          raw = gzip.decompress(base64.b64decode(""))
          with open("app/src/main/assets/index.html", "wb") as f:
              f.write(raw)
          with open("index.html", "wb") as f:
              f.write(raw)

          print("Android project ready!")
          PY

      - name: Build Production Signed Release APK
        run: |
          gradle assembleRelease --no-daemon
          APKSIGNER=$(ls -d /usr/local/lib/android/sdk/build-tools/*/apksigner | tail -n 1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload SwipeClean Production APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipeClean-Production-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish Only Latest Production Release with Build Number & Changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk SwipeClean.apk
          APK_SHA256=$(sha256sum SwipeClean.apk | awk '{print $1}')
          APK_SIZE=$(du -h SwipeClean.apk | awk '{print $1}')
          BUILD_NUM="${{ github.run_number }}"
          TAG="v1.0.${BUILD_NUM}"
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" || echo "Production release update")

          # Remove all previous releases and their tags so ONLY the latest release remains
          for old_tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$old_tag" != "$TAG" ]; then
              gh release delete "$old_tag" --yes --cleanup-tag || true
            fi
          done

          cat <<EOF > release_notes.md
          ### SwipeClean Production Release — Build #${BUILD_NUM} (\`${TAG}\`)

          **Latest Commit Change:** ${COMMIT_MSG}

          #### What's New & Improved in This Build
          - **Non-Overlapping Media Stage:** Dedicated top header and bottom action bar so photos and videos fit 100% cleanly between the header and footer without being covered.
          - **3D Pop-Out Keep & Delete Buttons:** Elevated tactile emerald **Keep** (left) and rose **Delete** (right) buttons with 3D depth and press physics.
          - **Full Video Audio & Center-Tap Mute/Play:** Native HTTP 206 byte-range video/audio streaming; tap the center of any video to toggle mute and play audio with an on-screen status indicator.
          - **Separate Liked Folders:** Liked photos save to \`Pictures/SwipeClean Liked Photos\` and liked videos save to \`Movies/SwipeClean Liked Videos\`.
          - **Streamlined Controls:** Removed the Zoom inspector modal and button for a distraction-free workflow.
          - **Production V1+V2+V3+V4 APK Signing:** Signed only as a production release APK (debug APK removed) with consistent keystore signature for seamless updates.

          #### Package Verification
          - **File:** \`SwipeClean.apk\` (${APK_SIZE})
          - **Version:** \`1.0.${BUILD_NUM}\` (Version Code \`$((100 + BUILD_NUM))\`)
          - **SHA-256 Checksum:** \`${APK_SHA256}\`
          EOF

          sed -i 's/^          //' release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SwipeClean.apk --clobber
            gh release edit "$TAG" --title "SwipeClean $TAG (Build #$BUILD_NUM)" --notes-file release_notes.md --latest
          else
            gh release create "$TAG" SwipeClean.apk --target "${{ github.sha }}" --title "SwipeClean $TAG (Build #$BUILD_NUM)" --notes-file release_notes.md --latest
          fi
