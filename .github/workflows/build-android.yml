name: Build SwipeClean Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  release:
    types: [ published, edited ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          SDKM=$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | tail -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" 

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Android Project & Assets
        run: |
          python3 - << 'PY'
          import base64, gzip, os, shutil

          os.makedirs("app/src/main/java/com/swipeclean/gallery", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)
          os.makedirs("app/src/main/res/mipmap-xxxhdpi", exist_ok=True)

          files = {
              "settings.gradle": "",
              "build.gradle": "cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMi4yJyBhcHBseSBmYWxzZQp9Cg==",
              "app/build.gradle": "",
              "app/swipeclean.jks": "",
              "app/src/main/AndroidManifest.xml": "",
              "app/src/main/java/com/swipeclean/gallery/MainActivity.java": "",
              "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png": "",
              "app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png": ""
          }

          for path, content_b64 in files.items():
              if path in ("app/build.gradle", "app/swipeclean.jks") or not os.path.exists(path):
                  with open(path, "wb") as f:
                      f.write(base64.b64decode(content_b64))

          if os.path.exists("index.html"):
              shutil.copy("index.html", "app/src/main/assets/index.html")
          elif not os.path.exists("app/src/main/assets/index.html"):
              raw = gzip.decompress(base64.b64decode(""))
              with open("app/src/main/assets/index.html", "wb") as f:
                  f.write(raw)

          print("Android project ready!")
          PY

      - name: Build Installable APK
        run: gradle assembleRelease assembleDebug --no-daemon

      - name: Upload SwipeClean APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipeClean-Installable-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk

      - name: Attach Direct APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk SwipeClean.apk
          cp app/build/outputs/apk/debug/app-debug.apk SwipeClean-debug.apk
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SwipeClean.apk SwipeClean-debug.apk --clobber
          else
            gh release create "$TAG" SwipeClean.apk SwipeClean-debug.apk --title "SwipeClean ($TAG)" --notes "Automated APK build from commit ${{ github.sha }}"
          fi
